
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API Demo</title>
</head>
<body>
    <h2>Exploring the Fetch API</h2>

    <button id="loadData">Load Post Data</button>
    <button id="createPost">Create New Post</button>

    <div id="output" style="margin-top: 20px; border: 1px solid #ccc; padding: 10px;"></div>

    <script>
        const output = document.getElementById("output");

        document.getElementById("loadData").addEventListener("click", function() {
            output.textContent = "Loading...";

            fetch("https://jsonplaceholder.typicode.com/posts/1")
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Failed to load post.");
                    }
                    return response.json();
                })
                .then(data => {
                    output.innerHTML = "";

                    const title = document.createElement("p");
                    title.textContent = "Post Title: " + data.title;

                    const body = document.createElement("p");
                    body.textContent = "Content: " + data.body;

                    output.appendChild(title);
                    output.appendChild(body);
                })
                .catch(error => {
                    output.textContent = "Error: " + error.message;
                });
        });

        document.getElementById("createPost").addEventListener("click", function() {
            output.textContent = "Creating post...";

            fetch("https://jsonplaceholder.typicode.com/posts", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    title: "My New Post",
                    body: "Learning Fetch API is fun!",
                    userId: 1
                })
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Failed to create post.");
                    }
                    return response.json();
                })
                .then(data => {
                    output.innerHTML = "";

                    const message = document.createElement("p");
                    message.textContent = "New Post Created!";

                    const id = document.createElement("p");
                    id.textContent = "Post ID: " + data.id;

                    output.appendChild(message);
                    output.appendChild(id);
                })
                .catch(error => {
                    output.textContent = "Error: " + error.message;
                });
        });
    </script>
</body>
</html>
